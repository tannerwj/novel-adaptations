name = "novel-adaptations"
main = "src/index.tsx"
compatibility_date = "2026-09-01"
workers_dev = true

# Production routes: apex + www (managed via API; declared here so deploys keep them)
[[routes]]
pattern = "noveladaptations.com/*"
zone_name = "noveladaptations.com"

[[routes]]
pattern = "www.noveladaptations.com/*"
zone_name = "noveladaptations.com"

[[d1_databases]]
binding = "DB"
database_name = "novel-adaptations"
database_id = "c5b38c69-8695-4841-8191-d004b323fdd6"
migrations_dir = "migrations"

# Phase 4 (observability): Workers Logs + Traces. Sampling left at defaults.
[observability]
enabled = true

# Outbound email (magic-link sign-in) via Cloudflare Email Service.
# Per https://developers.cloudflare.com/email-service/api/send-emails/workers-api/
# the sender address must belong to a domain onboarded for Email Sending.
# OWNER ACTION REQUIRED before sign-in emails work in production: in the
# dashboard go to Compute → Email Service → Email Sending → Onboard Domain and
# pick noveladaptations.com. That only adds DNS records on the cf-bounce
# subdomain (MX/SPF/DKIM) plus a _dmarc TXT — it does not touch root MX
# records, so existing mail flow is unaffected. The binding is locked to the
# single sender address below.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@noveladaptations.com"]

# News pipeline: daily ingestion run at 06:00 UTC (docs/NEWS_PIPELINE.md §1).
# Credits drain: every 2 minutes, one cast+ratings batch while work remains
# (migration 0026; self-draining, no-ops when the queue is empty).
[triggers]
crons = ["0 6 * * *", "*/2 * * * *", "*/5 * * * *"]

# Workers AI, called through the "novel-adaptations" AI Gateway
# (see src/news/ingest.ts). Heuristic fallback if unavailable.
[ai]
binding = "AI"

# SPA static assets (public/styles.css, public/app.js, public/js/*). Served by
# Cloudflare; the worker only handles page shells, /api/v1, SEO, and favicons.
[assets]
directory = "public"

# News pipeline kill switch (Track A guardrails; see docs/NEWS_PIPELINE.md
# "Autonomy policy"). scheduledNewsRun() in src/news/ingest.ts does nothing
# unless this is exactly "1" — fail closed when unset. Set to "0" (or remove
# the var) and redeploy for an emergency stop; disabled runs stay visible in
# /admin/news/runs.
[vars]
PIPELINE_ENABLED = "1"
